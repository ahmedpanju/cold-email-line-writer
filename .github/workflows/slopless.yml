name: Slopless Security Scan

on:
  pull_request:
    branches: [main, master]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: xors-software/slopless-action@v1
        with:
          license-key: ${{ secrets.SLOPLESS_LICENSE_KEY }}
